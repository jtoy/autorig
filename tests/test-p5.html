<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Character - p5.js (Simplified)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .info {
            color: #ecf0f1;
            margin-top: 20px;
            text-align: center;
        }
        .code {
            background: #34495e;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            margin-top: 10px;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="info">
        <h2>Simplified p5.js API</h2>
        <div class="code">
            Only 3 lines of setup code!<br>
            const renderer = new P5Renderer(p);<br>
            await renderer.loadImages(rigData);<br>
            renderer.render(rigData);
        </div>
    </div>

    <script type="module">
        import { P5Renderer } from './dist/modules/adapters/p5Renderer.js';

        const sketch = (p) => {
            let rigData;
            let renderer;

            p.setup = async function() {
                p.createCanvas(800, 800).parent('canvas-container');
                p.background(240);

                try {
                    // Load character data
                    const response = await fetch('tank.json');
                    rigData = await response.json();

                    // 🎉 SIMPLIFIED API - Only 2 lines!
                    renderer = new P5Renderer(p);
                    await renderer.loadImages(rigData);

                    p.redraw();
                } catch (error) {
                    console.error('Failed to load:', error);
                }
            };

            p.draw = function() {
                if (!renderer || !renderer.ready()) return;

                p.background(240);

                // 🎉 One line to render!
                renderer.renderRig(rigData, {
                    width: p.width,
                    height: p.height
                }, true); // true = show pivot points

                p.noLoop();
            };

            p.mousePressed = function() {
                if (renderer && renderer.ready()) {
                    p.redraw();
                }
            };
        };

        new p5(sketch);
    </script>
</body>
</html>
