<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Character Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #34495e;
            background: #ecf0f1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="800" height="800"></canvas>

    <script type="module">
        import { renderCharacterRig } from './dist/modules/renderRig.js';

        // Load tank.json, cache all images, and render
        async function init() {
            try {
                console.log('🚀 Initializing Tank character renderer...');
                
                // Load character data
                const response = await fetch('tank.json');
                const tankData = await response.json();
                console.log('✓ Loaded tank.json');
                
                // Get canvas
                const canvas = document.getElementById('canvas');
                
                // renderCharacterRig automatically loads and caches images
                await renderCharacterRig(canvas, tankData);

                console.log('✓ Tank character rendered successfully');
            } catch (error) {
                console.error('❌ Failed to render:', error);
                document.body.innerHTML = `<div style="color: #e74c3c; padding: 20px;">Error: ${error.message}</div>`;
            }
        }

        init();
    </script>
</body>
</html>
