<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank Character - p5.js (Advanced Control)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
            font-family: Arial, sans-serif;
        }
        #canvas-container {
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .info {
            color: #ecf0f1;
            margin-top: 20px;
            text-align: center;
            max-width: 800px;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="info">
        <h2>Advanced Control Demo</h2>
        <p>
            Move mouse to control head rotation<br>
            Click to make character wave<br>
            Shows how to intercept and modify render data
        </p>
    </div>

    <script type="module">
        import { P5Renderer } from './dist/modules/adapters/p5Renderer.js';

        const sketch = (p) => {
            let rigData;
            let renderer;
            let waveAnimation = 0;

            p.setup = async function() {
                p.createCanvas(800, 800).parent('canvas-container');

                try {
                    const response = await fetch('tank.json');
                    rigData = await response.json();

                    renderer = new P5Renderer(p);
                    await renderer.loadImages(rigData);
                } catch (error) {
                    console.error('Failed to load:', error);
                }
            };

            p.draw = function() {
                if (!renderer || !renderer.ready()) return;

                p.background(240);

                // 🎨 ADVANCED: Modify rig data before computing
                // Make head follow mouse
                const mouseAngle = p.atan2(p.mouseY - p.height/2, p.mouseX - p.width/2);
                rigData.rotationValues = rigData.rotationValues || {};
                rigData.rotationValues.head = mouseAngle * 0.2; // Subtle head turn

                // Wave animation
                if (waveAnimation > 0) {
                    const wave = p.sin(waveAnimation * 0.2) * 30;
                    rigData.rotationValues.leftArm = wave;
                    rigData.rotationValues.leftForearm = wave * 0.5;
                    waveAnimation++;
                    if (waveAnimation > 50) waveAnimation = 0;
                }

                // 🎨 ADVANCED: Get computed data and modify it
                const renderData = renderer.compute(rigData, {
                    width: p.width,
                    height: p.height
                });

                // Add custom effects to individual parts
                renderData.objects.forEach(obj => {
                    // Make head slightly bigger
                    if (obj.name === 'head') {
                        obj.scaleX *= 1.1;
                        obj.scaleY *= 1.1;
                    }

                    // Add breathing effect to torso
                    if (obj.name === 'torso') {
                        const breathe = 1 + p.sin(p.frameCount * 0.05) * 0.02;
                        obj.scaleX *= breathe;
                        obj.scaleY *= breathe;
                    }

                    // Add slight wobble to hands
                    if (obj.name === 'leftHand' || obj.name === 'rightHand') {
                        obj.rotation += p.sin(p.frameCount * 0.1 + obj.x) * 0.05;
                    }
                });

                // 🎨 Render with custom modifications
                renderer.renderObjects(renderData.objects, true, renderData.pivotPoints);

                // Draw custom overlay (distance to mouse indicator)
                const headObj = renderData.objects.find(obj => obj.name === 'head');
                if (headObj) {
                    p.push();
                    p.stroke(255, 0, 0, 100);
                    p.strokeWeight(2);
                    p.line(headObj.x, headObj.y, p.mouseX, p.mouseY);
                    p.pop();
                }
            };

            p.mousePressed = function() {
                // Start wave animation
                waveAnimation = 1;
            };
        };

        new p5(sketch);
    </script>
</body>
</html>
